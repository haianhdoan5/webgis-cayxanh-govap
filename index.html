<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Quản Lý Cây Xanh Đô Thị - Quận Gò Vấp</title>
    <!-- Nhúng CSS chuẩn của ArcGIS Maps SDK for JavaScript -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/@arcgis/core/assets/esri/themes/light/main.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- Thanh Header -->
      <header class="app-header">
        <div class="brand">
          <span class="tree-icon">🌳</span>
          <h1>WebGIS Quản Lý Cây Xanh Quận Gò Vấp</h1>
        </div>
        <div class="header-actions">
          <span class="role-badge">Chế độ: Tra cứu & Quản lý</span>
        </div>
      </header>

      <!-- Khung nội dung chính -->
      <div class="main-content">
        <!-- Sidebar bên trái (Khung điều khiển & Danh sách lớp) -->
        <aside class="sidebar">
          <div class="panel-section">
            <h3>Danh sách lớp dữ liệu</h3>
            <div id="layerListDiv"></div>
          </div>
          <div class="panel-section">
            <h3>Chú giải bản đồ (Legend)</h3>
            <div id="legendDiv"></div>
          </div>
        </aside>

        <!-- Khung hiển thị Bản đồ -->
        <main id="viewDiv"></main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
